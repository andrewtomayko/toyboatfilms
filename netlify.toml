# Send every other address for the site to the real domain, so search engines see one site.

# Netlify's default address
[[redirects]]
  from = "https://toyboat.netlify.app/*"
  to = "https://toyboatfilms.com/:splat"
  status = 301
  force = true

# Old company domain (takes effect once northgrown.com is added as a domain alias in Netlify)
[[redirects]]
  from = "https://northgrown.com/*"
  to = "https://toyboatfilms.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.northgrown.com/*"
  to = "https://toyboatfilms.com/"
  status = 301
  force = true

# Each deploy writes a page for every film (/work/...), the homepage grid and the sitemap
# from data/videos.json, so search engines can read them. Nothing else is built.
[build]
  command = "node scripts/build-pages.mjs"
  publish = "."

# /work on its own has no page: send it to the homepage grid
[[redirects]]
  from = "/work"
  to = "/"
  status = 301

[build.environment]
  NODE_VERSION = "22"

# Server code for /invoices
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The invoicing app is private: keep it out of search engines and browser caches
[[headers]]
  for = "/invoices/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/stats/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

# The gear list is shared by link only: keep it out of search results
[[headers]]
  for = "/gear/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
