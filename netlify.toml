# Send every other address for the site to the real domain, so search engines see one site.

# Netlify's default address
[[redirects]]
  from = "https://toyboat.netlify.app/*"
  to = "https://toyboatfilms.com/:splat"
  status = 301
  force = true

# Old company domain (takes effect once northgrown.com is added as a domain alias in Netlify)
[[redirects]]
  from = "https://northgrown.com/*"
  to = "https://toyboatfilms.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.northgrown.com/*"
  to = "https://toyboatfilms.com/"
  status = 301
  force = true

# Server code for /invoices (the website itself has no build step)
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The invoicing app is private: keep it out of search engines and browser caches
[[headers]]
  for = "/invoices/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/stats/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
