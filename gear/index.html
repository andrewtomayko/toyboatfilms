<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="robots" content="noindex" />
  <title>Gear List | Toy Boat Films</title>
  <meta name="description" content="Camera, audio, lighting and grip gear available on Toy Boat Films productions." />
  <link rel="icon" href="/Assets/favicon/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/Assets/favicon/apple-touch-icon.png" />
  <style>
    /* Same look as the homepage. The list lives in /data/gear.json and is edited in /admin (Gear list tab). */
    :root{
      --bg:#0b0b0b;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --border:#262626;
      --sidePadding:32px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }
    a{ color:inherit; }
    :focus-visible{ outline:2px solid currentColor; outline-offset:3px; }

    header{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding:22px var(--sidePadding);
      border-bottom:1px solid var(--border);
    }
    .logo{ font-size:15px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; text-decoration:none; }
    .printBtn{
      background:none; border:1px solid currentColor; color:inherit; cursor:pointer;
      padding:9px 14px; font:inherit; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
      transition:background .2s ease, color .2s ease;
    }
    .printBtn:hover{ background:var(--text); color:var(--bg); }

    main{ max-width:880px; margin:0 auto; padding:56px var(--sidePadding) 72px; }
    h1{ margin:0 0 10px; font-size:clamp(28px, 4vw, 40px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .intro{ margin:0 0 8px; max-width:62ch; font-size:16px; line-height:1.65; color:#d6d6d6; white-space:pre-line; }
    .updated{ margin:0; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

    .sections{ margin-top:44px; display:grid; gap:40px; }
    .section h2{
      margin:0 0 6px; padding-bottom:10px; border-bottom:1px solid var(--border);
      font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    }
    .section ul{ list-style:none; margin:0; padding:0; }
    .section li{
      display:grid; grid-template-columns:3.2em minmax(0,1fr); gap:10px; align-items:baseline;
      padding:11px 0; border-bottom:1px solid #1a1a1a; font-size:16px; line-height:1.45;
    }
    .qty{ color:var(--muted); font-variant-numeric:tabular-nums; font-size:14px; }
    .empty{ color:var(--muted); }

    footer{
      max-width:880px; margin:0 auto; padding:0 var(--sidePadding) 48px;
      display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:space-between;
      font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    }
    footer a{ text-decoration:none; }
    footer a:hover{ color:var(--text); }

    @media (max-width: 700px){
      :root{ --sidePadding:20px; }
      main{ padding-top:40px; }
      .section li{ font-size:15px; }
    }

    /* Printing (or saving as PDF): black on white, no buttons, sections kept together where possible */
    @media print{
      :root{ --bg:#fff; --text:#111; --muted:#666; --border:#bbb; }
      .printBtn{ display:none; }
      header{ padding:0 0 12px; }
      main{ padding:24px 0 0; max-width:none; }
      .intro{ color:#333; }
      .sections{ margin-top:24px; gap:22px; }
      .section{ break-inside:avoid; }
      .section li{ padding:5px 0; font-size:11pt; border-bottom-color:#e5e5e5; }
      footer{ padding:24px 0 0; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">Toy Boat</a>
    <button class="printBtn" type="button" onclick="print()">Print / Save PDF</button>
  </header>

  <main>
    <h1 id="title">Gear List</h1>
    <p class="intro" id="intro" hidden></p>
    <p class="updated" id="updated"></p>
    <div class="sections" id="sections"><p class="empty">Loading…</p></div>
  </main>

  <footer>
    <span>Andrew Tomayko · Toy Boat Films</span>
    <a href="/">toyboatfilms.com</a>
  </footer>

  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDate = (iso) => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      return m ? new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) : "";
    };

    function render(gear) {
      document.getElementById("title").textContent = gear.title || "Gear List";
      document.title = `${gear.title || "Gear List"} | Toy Boat Films`;
      const intro = document.getElementById("intro");
      intro.textContent = gear.intro || "";
      intro.hidden = !gear.intro;
      document.getElementById("updated").textContent = gear.updated ? `Updated ${fmtDate(gear.updated)}` : "";
      const sections = (gear.sections || []).filter((s) => (s.items || []).some((it) => it.name));
      document.getElementById("sections").innerHTML = sections.length ? sections.map((s) => `
        <section class="section">
          <h2>${esc(s.name)}</h2>
          <ul>${s.items.filter((it) => it.name).map((it) => `
            <li><span class="qty">${it.qty ? `(${esc(it.qty)})` : ""}</span><span>${esc(it.name)}</span></li>`).join("")}
          </ul>
        </section>`).join("") : '<p class="empty">The gear list is being updated. Check back soon.</p>';
    }

    // The editor's preview sends its unsaved draft here (inside its own preview frame only)
    const DRAFT = new URLSearchParams(location.search).has("draft-preview") && window.parent !== window;
    if (DRAFT) {
      addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.type === "tb-gear-draft") render(e.data.gear); });
      window.parent.postMessage({ type: "tb-gear-draft-ready" }, location.origin);
    } else {
      fetch("/data/gear.json", { cache: "no-cache" })
        .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(render)
        .catch(() => { document.getElementById("sections").innerHTML = '<p class="empty">The gear list couldn’t be loaded. Please try again in a moment.</p>'; });
    }
  </script>
</body>
</html>
