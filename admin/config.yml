backend:
  name: git-gateway
  branch: main

site_url: https://toyboatfilms.com
display_url: https://toyboatfilms.com
logo_url: /Assets/favicon/apple-touch-icon.png

media_folder: "thumbnails"
public_folder: "/thumbnails"

collections:
  - name: "content"
    label: "Website"
    editor:
      preview: true
    files:
      - name: "videos"
        label: "Videos"
        description: "Your portfolio grid. Drag videos to reorder them; the site shows them in this order, left to right, top to bottom."
        file: "data/videos.json"
        format: "json"
        fields:
          - label: "Videos"
            name: "videos"
            label_singular: "video"
            widget: "list"
            collapsed: true
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
                hint: "Shown on the thumbnail when someone hovers over it, and above the description in the popup."

              - label: "Client"
                name: "client"
                widget: "string"
                required: false
                hint: "Optional. Shown under the title on the thumbnail, and as “Client:” in the popup."

              - label: "Agency"
                name: "agency"
                widget: "string"
                required: false
                hint: "Optional. Shown as “Agency:” in the popup, for projects made through an agency."

              - label: "Year"
                name: "year"
                widget: "string"
                required: false
                hint: "Optional, e.g. 2026."

              - label: "Video link"
                name: "url"
                widget: "string"
                pattern: ['(youtube\.com|youtu\.be|vimeo\.com)', "Paste a YouTube or Vimeo link"]
                hint: "Paste the link straight from YouTube or Vimeo. Private Vimeo links work too (they look like vimeo.com/123456789/abc123)."

              - label: "Thumbnail"
                name: "thumb"
                widget: "image"
                choose_url: false
                hint: "16:9 JPG, ideally 1920×1080 and under 500 KB. Export from Photoshop with File › Export › Export As… › JPG, quality around 80%."

              - label: "Description"
                name: "description"
                widget: "text"
                required: false
                hint: "Optional. A few sentences about the project, shown under the video in the popup. Leave empty to hide."

              - label: "Credits"
                name: "credits"
                widget: "list"
                required: false
                label_singular: "credit"
                collapsed: false
                summary: "{{fields.role}}: {{fields.name}}"
                hint: "Optional. One line per role, e.g. Director: Andrew Tomayko. Leave empty to hide the credits section."
                fields:
                  - { label: "Role", name: "role", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }

      - name: "site"
        label: "Homepage text & contact"
        description: "The words at the top of the homepage, the buttons, and the links in the footer."
        file: "data/site.json"
        format: "json"
        fields:
          - { label: "Logo text", name: "logo", widget: "string", hint: "Top-left corner of every page." }
          - { label: "Headline", name: "headline", widget: "string", hint: "The large sentence under the reel." }
          - { label: "Intro paragraph", name: "description", widget: "text" }
          - { label: "Location line", name: "location", widget: "string", required: false, hint: "Small grey text under the intro." }
          - { label: "Main button text", name: "cta", widget: "string", hint: "The button under the intro that opens the contact form." }
          - { label: "Header button text", name: "headerCta", widget: "string", required: false, hint: "The button in the top-right corner. Also opens the contact form." }
          - { label: "Contact email", name: "email", widget: "string", required: false, hint: "Optional. Shown as a link in the footer." }
          - { label: "Instagram link", name: "instagram", widget: "string", required: false, hint: "Optional. Full link, e.g. https://instagram.com/toyboatfilms" }
